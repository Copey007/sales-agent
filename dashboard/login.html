<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — A-Gent Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0f;
      color: #f0f0f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
    }
    
    .emblem {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, #c9a227, #8b6914);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
    }
    
    h1 {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }
    
    .tagline {
      text-align: center;
      color: #888;
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }
    
    .form-card {
      background: #16161f;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 2rem;
    }
    
    .form-group {
      margin-bottom: 1.25rem;
    }
    
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #888;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      background: #0a0a0f;
      color: #f0f0f5;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    
    input:focus {
      border-color: #c9a227;
    }
    
    input::placeholder {
      color: #555;
    }
    
    .submit-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #c9a227 0%, #8b6914 100%);
      border: none;
      border-radius: 8px;
      color: #0a0a0f;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }
    
    .submit-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 20px rgba(201,162,39,0.4);
    }
    
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .error-msg {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 0.875rem;
      color: #ef4444;
      font-size: 0.8rem;
      margin-bottom: 1rem;
      display: none;
    }
    
    .error-msg.show {
      display: block;
    }
    
    .hint {
      text-align: center;
      font-size: 0.7rem;
      color: #555;
      margin-top: 1.5rem;
    }
    
    .hint code {
      background: rgba(255,255,255,0.05);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="emblem">🤖</div>
    <h1>A-Gent Dashboard</h1>
    <p class="tagline">Enter your password to continue</p>
    
    <div class="form-card">
      <div class="error-msg" id="errorMsg">Incorrect password. Please try again.</div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required autofocus>
        </div>
        
        <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
      </form>
      
      <p class="hint">Default password: <code>agent123</code></p>
    </div>
  </div>
  
  <script>
    // Default credentials — change this to your actual password
    const CORRECT_PASSWORD = 'agent123';
    
    // Store the session token (valid for 7 days)
    const SESSION_KEY = 'agent_dashboard_session';
    const SESSION_DURATION = 7 * 24 * 60 * 60 * 1000; // 7 days
    
    // Check if already signed in
    function checkSession() {
      const session = localStorage.getItem(SESSION_KEY);
      if (session) {
        const { token, expiry } = JSON.parse(session);
        if (Date.now() < expiry) {
          // Valid session — redirect to dashboard
          window.location.href = 'index.html';
          return;
        }
      }
    }
    
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('errorMsg');
      const btn = document.getElementById('submitBtn');
      
      if (password === CORRECT_PASSWORD) {
        // Create session
        const session = {
          token: 'authenticated',
          expiry: Date.now() + SESSION_DURATION,
        };
        localStorage.setItem(SESSION_KEY, JSON.stringify(session));
        
        // Redirect to dashboard
        window.location.href = 'index.html';
      } else {
        errorEl.classList.add('show');
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    });
    
    // Check on load
    checkSession();
  </script>
</body>
</html>
