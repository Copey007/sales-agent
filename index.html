function statusBadge(st){const s=String(st||'').toLowerCase();const cls=['active','sent','delivered','opened','replied','queued'].includes(s)?'green':(s==='alert'?'red':''); return `<span class="badge ${cls}">${esc(st||'unknown')}</span>`;} function waveform(n=22){return `<div class="waveform">${Array.from({length:n},(_,i)=>`<span style="animation-delay:${(i*.045).toFixed(2)}s;animation-duration:${(.86+(i%6)*.08).toFixed(2)}s"></span>`).join('')}</div>`;}
function counts(){const by=state.steps.reduce((a,s)=>{const k=String(s.status||'unknown').toLowerCase();a[k]=(a[k]||0)+1;return a;},{});const total=state.steps.length;return{total,queued:by.queued||0,sent:by.sent||0,delivered:by.delivered||0,opened:by.opened||0,replied:by.replied||0,nonQueued:total-(by.queued||0),by};}
function shell(){ $('app').innerHTML=`<header class="topbar"><div class="topbar-inner"><div class="brand"><img src="assets/a-gent-wordmark.png" alt="A-Gent"><div class="divider"></div><div><div class="op-label">OPERATIONAL CORE <span class="version">SDR LIVE</span></div><div class="title">A-Gent AI SDR</div></div></div><div class="telemetry"><div class="pill green"><span class="led"></span>SAT-LINK: CONNECTED</div><div class="pill">SYS_TIME: <span id="clock">--:--:--</span></div><div class="pill green">DEF_GRID: ACTIVE</div><div id="sysState" class="pill green">SYS_STATE: NOMINAL</div><a class="nav-btn" href="https://magenta-kleicha-c9a1e6.netlify.app" target="_blank" rel="noopener">Command Center ↗</a><a class="nav-btn editor-nav" href="index.html#sequence-editor" onclick="switchTab('editor')">Email Editor</a><button class="sig-btn" onclick="load()">SIG_ALERT</button></div></div></header><div id="message"></div><nav class="workspace-tabs" aria-label="AI SDR workspace tabs"><button type="button" id="tabBtnEditor" class="workspace-tab active" onclick="switchTab('editor')"><strong>Email Sequence Editor</strong><span>Compact 12-step editor with people list and individual queued email editing.</span></button><button type="button" id="tabBtnPipeline" class="workspace-tab" onclick="switchTab('pipeline')"><strong>SDR Pipeline Actions</strong><span>Metrics, AI fleet deployment, and real activity log from Supabase.</span></button><button type="button" id="tabBtnQueue" class="workspace-tab" onclick="switchTab('queue')"><strong>Email Setup Queue</strong><span>Queued and scheduled email-step ledger; click a row to edit it.</span></button></nav><section id="tabPanelEditor" class="tab-panel active"><section id="sequence-editor" class="panel"><div class="section-head" style="margin-top:0"><div><h2>Email Sequence Editor</h2><p class="muted small" style="margin:8px 0 0">Compact step navigation for the 12-email cadence: choose Step 1-12, select a queued contact, then edit the individual subject and body. Sent or engaged emails remain visible but read-only.</p></div><div class="sequence-editor-toolbar"><span id="sequenceEditorBadge" class="badge green">Loading</span><button type="button" class="sig-btn" onclick="load()">Reload</button></div></div><div id="sequenceEditorMessage" class="editor-message"></div><div id="sequenceEditor" class="sequence-editor-shell"></div></section></section><section id="tabPanelPipeline" class="tab-panel"><div class="section-head"><h2>SDR Pipeline Actions</h2><div><span id="activeBadge" class="badge green">Loading</span> <button class="button" onclick="load()">Live Telemetry</button></div></div><section class="grid grid-4"><a class="card" href="https://a-gent-ai-sdr.netlify.app/${CRM_URL}" target="_blank" rel="noopener"><div class="metric-label">Prospects</div><div id="contactsMetric" class="metric-value">0</div><div class="metric-note">Live contacts rows in Supabase.</div><div class="drill-hint">Launch CRM ↗</div></a><button type="button" class="card" onclick="openDrilldown('sent')"><div class="metric-label">Sent</div><div id="sentMetric" class="metric-value">0</div><div class="metric-note">Supabase steps not currently queued.</div><div class="drill-hint">View sent ledger</div></button><button type="button" class="card" onclick="openDrilldown('queued')"><div class="metric-label">Queued</div><div id="queuedMetric" class="metric-value">0</div><div class="metric-note">Upcoming email_steps by sequence stage.</div><div class="drill-hint">Inspect stages</div></button><button type="button" class="card" onclick="openDrilldown('replies')"><div class="metric-label">Replies</div><div id="replyMetric" class="metric-value">0</div><div class="metric-note">Only email_steps marked replied in Supabase.</div><div class="drill-hint">View reply rows</div></button></section><section class="grid grid-2" style="margin-top:18px"><div class="panel"><div class="section-head" style="margin-top:0"><h2>AI Fleet Deployment</h2><span id="fleetBadge" class="badge green">Loading</span></div><div id="sequenceCards" class="grid"></div></div><div class="panel"><div class="section-head" style="margin-top:0"><h2>Real Activity Log</h2><span id="activityBadge" class="badge">0 Rows</span></div><div id="activity"></div></div></section></section><section id="tabPanelQueue" class="tab-panel"><section class="panel"><div class="section-head" style="margin-top:0"><div><h2>Email Step Queue</h2><p class="muted small" style="margin:8px 0 0">Click any scheduled row to open that contact and step inside the Email Sequence Editor tab.</p></div><span id="statusText" class="badge green">Loading</span></div><div class="table-wrap"><table><thead><tr><th>Contact</th><th>Step</th><th>Week</th><th>Subject</th><th>Status</th><th>Schedule</th></tr></thead><tbody id="stepsTable"></tbody></table></div></section></section><div id="drilldown" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="drillTitle"><div class="modal-panel"><div class="modal-head"><div><h2 id="drillTitle">Pipeline Detail</h2><p id="drillSubtitle" class="muted small" style="margin:8px 0 0"></p></div><button class="icon-button" onclick="closeDrilldown()" aria-label="Close detail panel">×</button></div><div id="drillBody"></div></div></div><div class="footer-note">All displayed values are computed from live Supabase rows only.</div>`; clock();}
function model(){const contactsById=Object.fromEntries(state.contacts.map(c=>[c.id,c]));const sequencesById=Object.fromEntries(state.sequences.map(s=>[s.id,s]));const stepsBySeq=state.steps.reduce((a,s)=>((a[s.sequence_id]??=[]).push(s),a),{});Object.values(stepsBySeq).forEach(l=>l.sort((a,b)=>(a.step_number||0)-(b.step_number||0)));const rowForStep=s=>{const seq=sequencesById[s.sequence_id]||{};const contact=contactsById[seq.contact_id]||{};return{step:s,seq,contact};};return{contactsById,sequencesById,stepsBySeq,rowForStep};}

function switchTab(tab){const key=['editor','pipeline','queue'].includes(tab)?tab:'editor';['editor','pipeline','queue'].forEach(name=>{const panel=$('tabPanel'+name.charAt(0).toUpperCase()+name.slice(1));const btn=$('tabBtn'+name.charAt(0).toUpperCase()+name.slice(1));if(panel)panel.classList.toggle('active',name===key);if(btn)btn.classList.toggle('active',name===key);});if(key==='editor'){setTimeout(()=>{const el=$('sequence-editor');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},20);}}function openQueueEmail(stepId){const step=state.steps.find(s=>String(s.id)===String(stepId));if(!step){showSequenceEditorMessage('Could not find that queued email step in the current Supabase state.','err');switchTab('editor');return;}window.sequenceEditorActiveStep=Number(step.step_number)||1;window.sequenceEditorSelectedStepId=String(step.id);switchTab('editor');renderSequenceEditor();setTimeout(()=>{const el=$(stepFieldId(step.id,'subject'))||$('sequence-editor');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});if(el&&el.focus&&!el.readOnly&&!el.disabled)el.focus();},80);}function agentCard(seq){const {contactsById,stepsBySeq}=model();const c=contactsById[seq.contact_id]||{};const steps=stepsBySeq[seq.id]||[];const done=steps.filter(s=>String(s.status||'').toLowerCase()!=='queued').length;const next=steps.find(s=>String(s.status||'').toLowerCase()==='queued');const last=latest(steps.map(s=>s.sent_at||s.scheduled_at||s.created_at));return `<article class="agent-card"><div class="agent-top"><div class="avatar">SDR</div><div><div class="agent-name">${esc((c.name||'Unknown').toUpperCase())}</div><div class="agent-sub">${esc(c.company_name||'—')} · ${esc(c.email||'')}</div></div><span class="led"></span></div>${waveform(22)}<div class="kpis"><div class="kpi"><b>${done}</b><span>Sent</span><em>${pct(done,steps.length)}% complete</em></div><div class="kpi"><b>${steps.length-done}</b><span>Queued</span><em>${pct(steps.length-done,steps.length)}% remaining</em></div><div class="kpi"><b>${steps.filter(s=>String(s.status||'').toLowerCase()==='replied').length}</b><span>Replies</span><em>${pct(steps.filter(s=>String(s.status||'').toLowerCase()==='replied').length,Math.max(done,1))}% reply rate</em></div></div><div class="progress" style="margin-top:13px"><div class="bar" style="width:${pct(done,steps.length)}%"></div></div><div class="metric-note" style="margin-top:10px">Next queued: ${next?`Step ${esc(next.step_number)} · ${esc(next.subject)}`:'No queued step in Supabase'}</div><div class="agent-foot"><span>LAST_ACT: ${esc(timeAgo(last))}</span><span class="state">STATE: ${esc(seq.status||'ACTIVE')}</span></div></article>`;}
function render(){const c=counts();$('contactsMetric').textContent=state.contacts.length;$('sentMetric').textContent=c.nonQueued;$('queuedMetric').textContent=c.queued;$('replyMetric').textContent=c.replied;$('activeBadge').textContent=`${state.sequences.length} SEQUENCES · ${state.steps.length} STEPS`;$('fleetBadge').textContent=`ACTIVE ${state.sequences.filter(s=>String(s.status||'').toLowerCase()==='active').length} · IDLE ${state.sequences.filter(s=>String(s.status||'').toLowerCase()!=='active').length}`;$('activityBadge').textContent=`${state.activity.length} Rows`;$('statusText').textContent=`Queued ${c.queued} · Sent ${c.sent} · Delivered ${c.delivered} · Opened ${c.opened} · Replied ${c.replied}`;$('sysState').textContent='SYS_STATE: NOMINAL';$('sysState').className='pill green';$('message').innerHTML='';const {rowForStep}=model();$('sequenceCards').innerHTML=state.sequences.map(agentCard).join('')||'<p class="muted">No Supabase sequence rows found.</p>';const queuedEmailSteps=state.steps.filter(s=>String(s.status||'').toLowerCase()==='queued').sort((a,b)=>String(a.scheduled_at||'').localeCompare(String(b.scheduled_at||''))||Number(a.step_number||0)-Number(b.step_number||0)).slice(0,90);$('stepsTable').innerHTML=queuedEmailSteps.map(s=>{const {contact}=rowForStep(s);return `<tr class="queue-row" onclick="openQueueEmail('${esc(s.id)}')"><td><strong>${esc(contact.name||'Unknown')}</strong><br><span class="muted small">${esc(contact.company_name||'')}</span><span class="queue-open-hint">Open in editor</span></td><td>#${esc(s.step_number)}</td><td>${esc(s.week)}</td><td>${esc(s.subject)}</td><td>${statusBadge(s.status)}</td><td>${fmt(s.scheduled_at||s.sent_at)}</td></tr>`;}).join('')||'<tr><td colspan="6" class="muted">No queued scheduled email_steps rows found.</td></tr>';$('activity').innerHTML=state.activity.map(a=>`<div class="event"><strong>${esc(a.agent_name)} · ${esc(a.action)}</strong><div class="muted small">${fmt(a.timestamp)}</div><p>${esc(a.details|| function signalTitle(step){const raw=String(step&&step.signal_used||'');if(!raw)return 'No signal recorded';const colon=raw.indexOf(':');let v=colon>=0?raw.slice(colon+1).trim():raw;const paren=v.indexOf('(');if(paren>0)v=v.slice(0,paren).trim();return v||raw;}
function signalType(step){const raw=String(step&&step.signal_used||'');const colon=raw.indexOf(':');return colon>0?raw.slice(0,colon).replace(/_/g,' '):'public signal';}
function stepContext(){const contactsById={};state.contacts.forEach(c=>contactsById[String(c.id)]=c);const seqsById={};state.sequences.forEach(s=>seqsById[String(s.id)]=s);const rowsByStep={};state.steps.forEach(step=>{const n=Number(step.step_number)||0;(rowsByStep[n]=rowsByStep[n]||[]).push(step);});Object.values(rowsByStep).forEach(rows=>rows.sort((a,b)=>{const ca=contactsById[String((seqsById[String(a.sequence_id)]||{}).contact_id)]||{};const cb=contactsById[String((seqsById[String(b.sequence_id)]||{}).contact_id)]||{};return String(ca.company_name||ca.name||'').localeCompare(String(cb.company_name||cb.name||''))||String(a.scheduled_at||'').localeCompare(String(b.scheduled_at||''));}));return{contactsById,seqsById,rowsByStep};}
function contactForStep(step,ctx){const seq=ctx.seqsById[String(step&&step.sequence_id||'')]||{};return ctx.contactsById[String(seq.contact_id||'')]||{};}
function sequenceDayForStep(step){if(!step||!step.scheduled_at)return '';const seqRows=state.steps.filter(s=>String(s.sequence_id)===String(step.sequence_id)&&s.scheduled_at).sort((a,b)=>new Date(a.scheduled_at)-new Date(b.scheduled_at));const first=seqRows[0];if(!first)return '';const day=Math.max(1,Math.round((new Date(step.scheduled_at)-new Date(first.scheduled_at))/86400000)+1);return `Day ${day}`;}
function stepTimingLabel(step){if(!step)return 'Timing unavailable';const parts=[];if(step.week)parts.push(`Week ${step.week}`);const day=sequenceDayForStep(step);if(day)parts.push(day);if(step.scheduled_at)parts.push(`Scheduled ${fmt(step.scheduled_at)}`);return parts.join(' · ')||'Timing unavailable';}
function safeSplitMark(html,term){const safe=esc(term||'').trim();if(!safe||safe.length<2)return html;return html.split(safe).join(`<mark class="personalization-token">${safe}</mark>`);}
function highlightPersonalization(value,contact,step,withBreaks=true){let html=esc(value||'');html=html.replace(/(\{\{[^}]+\}\})/g,'<mark class="personalization-token">$1</mark>');const terms=[firstName(contact),contact&&contact.company_name,signalTitle(step)].filter(Boolean).sort((a,b)=>String(b).length-String(a).length);terms.forEach(t=>{html=safeSplitMark(html,t);});return withBreaks?html.replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>'):html;}
const FLEET_CTA_TEXT='To deploy A-Gent Fleet click here';const FLEET_CTA_URL='https://a-gent.co';function ensureFleetCtaText(value){const raw=String(value||'').trimEnd();if(!raw)return raw;if(raw.includes(FLEET_CTA_TEXT)||raw.includes(FLEET_CTA_URL))return raw;const cta=`${FLEET_CTA_TEXT}: ${FLEET_CTA_URL}`;if(/(^|\n)Signal source:/i.test(raw))return raw.replace(/\n(?=Signal source:)/i,`\n${cta}\n`);if(/(^|\n)— A-Gent Fleet\b/.test(raw))return raw.replace(/(^|\n)(— A-Gent Fleet\b[^\n]*)/,`$1$2\n${cta}`);if(/(^|\n)A-Gent Fleet\b/.test(raw))return raw.replace(/(^|\n)(A-Gent Fleet\b[^\n]*)/,`$1$2\n${cta}`);return `${raw}\n${cta}`;}function compactPreview(step,contact){if(!step)return '';const subject=highlightPersonalization(step.subject||'',contact,step,false);const body=`<p>${highlightPersonalization(ensureFleetCtaText(step.body||''),contact,step,true)}</p>`;return `<div class="email-preview-card"><h4>Preview with personalization highlights</h4><div class="preview-subject"><strong>Subject:</strong> ${subject}</div><div class="preview-body">${body}</div></div>`;}
function renderPersonalizationLogic(step,contact){if(!step)return '';return `<div class="logic-card"><h4>Signal & Personalization Logic</h4><div class="logic-grid"><div class="logic-row"><strong>Signal</strong><span>${esc(step.signal_used||'No signal recorded')}</span></div><div class="logic-row"><strong>Relevancy</strong><span>Uses the ${esc(signalType(step))} context, ${esc(contact.company_name||'company')} relevance, and ${esc(firstName(contact))}'s contact-level greeting for this specific email.</span></div></div><div class="token-strip"><span class="token-chip">{{first_name}} → ${esc(firstName(contact))}</span><span class="token-chip">{{company_name}} → ${esc(contact.company_name||'company')}</span><span class="token-chip">{{signal}} → ${esc(signalTitle(step))}</span></div></div>`;}
function selectSequenceStep(stepNumber){window.sequenceEditorActiveStep=Number(stepNumber)||1;window.sequenceEditorSelectedStepId=null;showSequenceEditorMessage('',null,true);renderSequenceEditor();}
function selectSequencePerson(stepId){window.sequenceEditorSelectedStepId=String(stepId);showSequenceEditorMessage('',null,true);renderSequenceEditor();setTimeout(()=>{const el=$(stepFieldId(stepId,'subject'));if(el&&!el.readOnly&&!el.disabled){el.focus();}},40);}
function focusSequenceBody(stepId){const body=$(stepFieldId(stepId,'body'));if(body&&!body.readOnly&&!body.disabled){body.focus();body.scrollIntoView({behavior:'smooth',block:'center'});}}
function showSequenceEditorMessage(text,type='ok',silent=false){const box=$('sequenceEditorMessage');if(!box)return;if(silent||!text){box.innerHTML='';return;}box.innerHTML=`<div class="notice ${type==='err'?'err':''}">${esc(text)}</div>`;}
function renderStepTabs(ctx,activeStep){return `<div class="step-tabs-card"><div class="step-tabs-head"><div><h3>Step Tabs</h3><div class="muted small" style="margin-top:6px">Click a step, then choose a person to open that exact email.</div></div><span class="badge green">Step ${activeStep} Active</span></div><div class="sequence-step-tabs" role="tablist" aria-label="Email sequence steps">${Array.from({length:12},(_,i)=>i+1).map(n=>{const rows=ctx.rowsByStep[n]||[];const active=n===activeStep;return `<button type="button" class="sequence-step-tab ${active?'active':''}" role="tab" aria-selected="${active?'true':'false'}" onclick="selectSequenceStep(${n})"><strong>Step ${n}</strong><span>${rows.length} people</span></button>`;}).join('')}</div></div>`;}
function renderPeopleList(rows,activeStep,selectedId,ctx){return `<aside class="people-list-card"><div class="people-list-head"><div><h3>People in Step ${activeStep}</h3><div class="muted small" style="margin-top:6px">Compact queue list by contact and company.</div></div><span class="badge">${rows.length} Rows</span></div><div class="people-list">${rows.length?rows.map(row=>{const c=contactForStep(row,ctx);const active=String(row.id)===String(selectedId);return `<button type="button" class="person-pick ${active?'active':''}" onclick="selectSequencePerson('${esc(row.id)}')"><span><span class="person-name">${esc(c.name||'Unknown Contact')}</span><span class="person-company">${esc(c.company_name||'No company')}</span><span class="person-meta">${esc(stepTimingLabel(row))}</span></span>${sequenceStatusBadge(row.status)}</button>`;}).join(''):'<div class="empty-step-note">No people are currently assigned to this step in Supabase.</div>'}</div></aside>`;}
function renderIndividualEmailEditor(step,contact){if(!step)return `<section class="email-editor-card"><div class="email-editor-content"><div class="empty-step-note">Choose a step with people to open an email editor.</div></div></section>`;const locked=isEmailStepLocked(step);const readonly=locked?' readonly disabled':'';const lockCopy=locked?'This email has already been sent or engaged and is read-only.':'Queued email: edit the subject and body, then click Save to update Supabase.';return `<section class="email-editor-card"><div class="email-editor-head"><div><h3>Individual Email Editor</h3><div class="muted small" style="margin-top:6px">Step ${esc(step.step_number)} · ${esc(stepTimingLabel(step))}</div></div>${sequenceStatusBadge(step.status)}</div><div class="email-editor-content"><div class="selected-contact-strip"><div><strong>${esc(contact.name||'Unknown Contact')}</strong><div class="muted small">${esc(contact.company_name||'No company')} · ${esc(contact.email||'No email')}</div></div><button type="button" class="edit-focus-btn" ${locked?'disabled':''} onclick="focusSequenceBody('${esc(step.id)}')">Edit This Email</button></div><div class="email-field"><label for="${stepFieldId(step.id,'subject')}">Subject</label><input id="${stepFieldId(step.id,'subject')}" value="${esc(step.subject||'')}" ${readonly} /></div><div class="email-field"><label for="${stepFieldId(step.id,'body')}">Body</label><textarea id="${stepFieldId(step.id,'body')}" ${readonly}>${esc(ensureFleetCtaText(step.body||''))}</textarea></div>${renderPersonalizationLogic(step,contact)}${compactPreview(step,contact)}<div class="email-actions"><div class="lock-note">${esc(lockCopy)}</div><button type="button" class="save-email-btn primary" data-save-step="${esc(step.id)}" ${locked?'disabled':''} onclick="saveSequenceStep('${esc(step.id)}')">Save Email</button></div></div></section>`;}
function renderSequenceEditor(){const badge=$('sequenceEditorBadge');const mount=$('sequenceEditor');if(!mount)return;const ctx=stepContext();let activeStep=Number(window.sequenceEditorActiveStep)||1;if(activeStep<1||activeStep>12)activeStep=1;window.sequenceEditorActiveStep=activeStep;const rows=ctx.rowsByStep[activeStep]||[];let selectedId=window.sequenceEditorSelectedStepId;if(!rows.some(r=>String(r.id)===String(selectedId)))selectedId=rows[0]?String(rows[0].id):null;window.sequenceEditorSelectedStepId=selectedId;const selected=rows.find(r=>String(r.id)===String(selectedId));const contact=selected?contactForStep(selected,ctx):{};if(badge)badge.textContent=`${state.steps.length} STEPS · ${rows.length} IN STEP ${activeStep}`;mount.innerHTML=`<div class="compact-sequence-shell">${renderStepTabs(ctx,activeStep)}<div class="sequence-workspace">${renderPeopleList(rows,activeStep,selectedId,ctx)}${renderIndividualEmailEditor(selected,contact)}</div></div>`;}
async function saveSequenceStep(stepId){const step=state.steps.find(s=>String(s.id)===String(stepId));if(!step){showSequenceEditorMessage('Could not find that email step in the current Supabase state.','err');return;}if(isEmailStepLocked(step)){showSequenceEditorMessage('This email has already been sent or engaged and is read-only.','err');return;}const subjectEl=$(stepFieldId(stepId,'subject'));const bodyEl=$(stepFieldId(stepId,'body'));const subject=(subjectEl&&subjectEl.value||'').trim();const body=ensureFleetCtaText((bodyEl&&bodyEl.value||'').trim());if(!subject||!body){showSequenceEditorMessage('Subject and body are required before saving.','err');return;}const btn=document.querySelector(`[data-save-step="${String(stepId).replace(/"/g,'\\"')}"]`);if(btn){btn.disabled=true;btn.textContent='Saving';}try{const rows=await api(`email_steps?id=eq.${encodeURIComponent(stepId)}`,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify({subject,body})});const updated=Array.isArray(rows)&&rows[0]?rows[0]:{...step,subject,body};Object.assign(step,updated);showSequenceEditorMessage(`Saved Step ${step.step_number} email for ${subject}.`);render();}catch(err){showSequenceEditorMessage(`Save failed: ${err.message}`,'err');}finally{const fresh=document.querySelector(`[data-save-step="${String(stepId).replace(/"/g,'\\"')}"]`);if(fresh&&!isEmailStepLocked(step)){fresh.disabled=false;fresh.textContent='Save Email';}}}
function openDrilldown(kind){const views={queued:renderQueuedDetail,replies:renderRepliesDetail,sent:renderSentDetail};const r=views[kind]?.();if(!r)return;$('drillTitle').textContent=r.title;$('drillSubtitle').textContent=r.subtitle;$('drillBody').innerHTML=r.html;$('drilldown').classList.remove('hidden');}
function renderQueuedDetail(){const {rowForStep}=model();const queued=state.steps.filter(s=>String(s.status||'').toLowerCase()==='queued').sort((a,b)=>(a.step_number-b.step_number)||String(a.scheduled_at||'').localeCompare(String(b.scheduled_at||'')));const by=queued.reduce((a,s)=>((a[s.step_number]??=[]).push(rowForStep(s)),a),{});const stages=Object.keys(by).sort((a,b)=>Number(a)-Number(b));const html=`<div class="drill-summary"><div class="drill-stat"><strong>${queued.length}</strong><span class="muted small">Queued rows</span></div><div class="drill-stat"><strong>${stages.length}</strong><span class="muted small">Stages with rows</span></div><div class="drill-stat"><strong>${uniq(queued.map(s=>rowForStep(s).contact.id))}</strong><span class="muted small">Contacts queued</span></div><div class="drill-stat"><strong>${state.steps.length?Math.max(...state.steps.map(s=>Number(s.step_number)||0)):0}</strong><span class="muted small">Max step in Supabase</span></div></div>`+(queued.length?`<div class="stage-grid">${stages.map(stage=>`<section class="stage-card"><h3>Stage ${esc(stage)} · Step ${esc(stage)}</h3><div class="muted small" style="margin-bottom:8px">${by[stage].length} live Supabase row${by[stage].length===1?'':'s'} queued at this step.</div>${by[stage].map(({step,contact})=>`<div class="person-row"><div><strong>${esc(contact.name||'Unknown')}</strong><div class="muted small">${esc(contact.email||'')} · ${esc(contact.company_name||'')}</div><div class="small" style="margin-top:6px;color:#fff4c4">Next: ${esc(step.subject)}</div></div><div style="text-align:right">${statusBadge(step.status)}<div class="muted small" style="margin-top:7px">${fmt(step.scheduled_at)}</div></div></div>`).join('')}</section>`).join('')}</div>`:`<div class="empty-state">No Supabase email_steps rows are currently queued.</div>`);return{title:'Queued Sequence Stages',subtitle:'Live Supabase email_steps grouped by actual step_number values.',html};}
function replyBody(step){return step.reply_content||step.reply_body||step.response_text||step.inbound_reply||step.reply||'';}
function renderRepliesDetail(){const {rowForStep}=model();const replied=state.steps.filter(s=>String(s.status||'').toLowerCase()==='replied').sort((a,b)=>String(b.sent_at||b.scheduled_at||'').localeCompare(String(a.sent_at||a.scheduled_at||''))).map(rowForStep);const html=`<div class="drill-summary"><div class="drill-stat"><strong>${replied.length}</strong><span class="muted small">Replied rows</span></div><div class="drill-stat"><strong>${uniq(replied.map(r=>r.contact.id))}</strong><span class="muted small">Contacts replied</span></div><div class="drill-stat"><strong>${replied.filter(r=>replyBody(r.step)).length}</strong><span class="muted small">Rows with body fields</span></div><div class="drill-stat"><strong>${pct(replied.length,Math.max(counts().nonQueued,1))}%</strong><span class="muted small">Reply rate</span></div></div>`+(replied.length?replied.map(({step,contact})=>`<article class="reply-card"><div class="agent-top"><div class="avatar">R</div><div><strong>${esc(contact.name||'Unknown')}</strong><div class="muted small">${esc(contact.email||'')} · ${esc(contact.company_name||'')}</div></div><div style="text-align:right">${statusBadge(step.status)}<div class="muted small" style="margin-top:7px">${fmt(step.sent_at||step.scheduled_at)}</div></div></div><div class="small" style="margin-top:10px;color:#fff4c4">Replied to: ${esc(step.subject)}</div><blockquote>${replyBody(step)?esc(replyBody(step)):'No reply body field is stored in Supabase for this replied row yet.'}</blockquote></article>`).join(''):`<div class="empty-state">No Supabase email_steps rows are currently marked replied.</div>`);return{title:'Reply Signals',subtitle:'Only real Supabase rows with status replied are shown. Missing reply bodies are labeled as missing when no reply body exists in Supabase.',html};}
function renderSentDetail(){const {rowForStep}=model();const sent=state.steps.filter(s=>String(s.status||'').toLowerCase()!=='queued').sort((a,b)=>String(b.sent_at||b.scheduled_at||'').localeCompare(String(a.sent_at||a.scheduled_at||''))).map(rowForStep);const html=`<div class="drill-summary"><div class="drill-stat"><strong>${sent.length}</strong><span class="muted small">Non-queued rows</span></div><div class="drill-stat"><strong>${uniq(sent.map(r=>r.contact.id))}</strong><span class="muted small">Recipients</span></div><div class="drill-stat"><strong>${counts().sent}</strong><span class="muted small">Status sent</span></div><div class="drill-stat"><strong>${counts().opened}</strong><span class="muted small">Status opened</span></div></div><div class="table-wrap"><table><thead><tr><th>Recipient</th><th>Email</th><th>Step</th><th>Subject</th><th>Status</th><th>Sent At</th></tr></thead><tbody>${sent.map(({step,contact})=>`<tr><td><strong>${esc(contact.name||'Unknown')}</strong><br><span class="muted small">${esc(contact.company_name||'')}</span></td><td>${esc(contact.email||'')}</td><td>#${esc(step.step_number)}<br><span class="muted small">Week ${esc(step.week)}</span></td><td>${esc(step.subject)}</td><td>${statusBadge(step.status)}</td><td>${fmt(step.sent_at||step.scheduled_at)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No Supabase email_steps rows are currently non-queued.</td></tr>'}</tbody></table></div>`;return{title:'Sent Email Ledger',subtitle:'Who received which live Supabase email step and when it was sent.',html};}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrilldown();});shell();load();
</script><script id="agent-original-logo-runtime">
(function () {
  var LOGO_SRC = '/assets/brand/agent-logo-master.svg';
  var HOME_URL = 'https://a-gent.co/';
  var PATCH_ATTR = 'data-agent-original-logo';
  var LAUNCH_URL = 'https://fleet.a-gent.co/login';
  var OLD_LAUNCH_URL = 'https://' + 'a-gent-fleet-app.netlify.app' + '/login';

  function looksLikeLaunchText(el) {
    var text = textOf(el);
    return /launch\s+console/i.test(text);
  }

  function patchLaunchLinks() {
    var nodes = Array.prototype.slice.call(document.querySelectorAll('a, button, [role="button"]'));
    var found = false;
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var href = el.getAttribute && (el.getAttribute('href') || '');
      if (href === OLD_LAUNCH_URL || href.indexOf('a-gent-fleet-app.netlify.app/login') !== -1 || href === LAUNCH_URL || looksLikeLaunchText(el)) {
        if (el.tagName && el.tagName.toLowerCase() === 'a') {
          el.setAttribute('href', LAUNCH_URL);
          el.setAttribute('target', '_self');
        } else {
          el.addEventListener('click', function(evt) { evt.preventDefault(); window.location.href = LAUNCH_URL; });
        }
        found = true;
      }
    }
    return found;
  }

  function ensureLaunchLink() {
    if (document.querySelector('a[href="' + LAUNCH_URL + '"]')) return true;
    var a = document.createElement('a');
    a.href = LAUNCH_URL;
    a.textContent = 'Launch Console';
    a.className = 'agent-launch-console-link';
    a.setAttribute('aria-label', 'Launch A-Gent Fleet Console');
    a.style.cssText = 'position:fixed;top:18px;right:18px;z-index:2147483647;background:#d4af37;color:#050505;border:1px solid rgba(212,175,55,.65);border-radius:999px;padding:10px 16px;font:700 12px/1 IBM Plex Mono, ui-monospace, monospace;text-transform:uppercase;letter-spacing:.08em;text-decoration:none;box-shadow:0 10px 30px rgba(0,0,0,.28);';
    document.body.appendChild(a);
    return true;
  }


  function textOf(el) {
    return (el && (el.innerText || el.textContent) || '').replace(/\s+/g, ' ').trim();
  }

  function inHeader(el) {
    return !!(el && el.closest && (el.closest('header') || el.closest('nav') || el.closest('[class*="header" i]') || el.closest('[class*="nav" i]') || el.closest('[class*="topbar" i]')));
  }

  function looksLikeBrand(el) {
    if (!el || el.getAttribute(PATCH_ATTR) === 'true') return false;
    var text = textOf(el);
    if (!text) return false;
    var clean = text.replace(/\s+/g, ' ').trim();
    var exactBrand = /^(A-GENT|A-Gent|A Gent|A-gent|AGENT)$/i.test(clean);
    var compactBrand = /^A-?GENT$/i.test(clean.replace(/\s+/g, ''));
    if (!(exactBrand || compactBrand)) return false;
    if (clean.length > 18) return false;
    if (!inHeader(el)) return false;
    if (el.matches && el.matches('button, [role="button"], .btn, [class*="button" i], [class*="cta" i]')) return false;
    return true;
  }

  function makeLogoLink(existing) {
    var a = (existing && existing.tagName && existing.tagName.toLowerCase() === 'a') ? existing : document.createElement('a');
    a.href = HOME_URL;
    a.setAttribute('aria-label', 'A-Gent home');
    a.setAttribute(PATCH_ATTR, 'true');
    a.classList.add('agent-original-logo-link');
    a.innerHTML = '<img class="agent-original-logo-img" src="' + LOGO_SRC + '" alt="A-Gent" decoding="async" />';
    return a;
  }

  function patchOnce() {
    var selectors = [
      'header a', 'nav a', 'header [class*="logo" i]', 'nav [class*="logo" i]',
      'header [class*="brand" i]', 'nav [class*="brand" i]', '[class*="wordmark" i]'
    ].join(',');
    var candidates = Array.prototype.slice.call(document.querySelectorAll(selectors));
    for (var i = 0; i < candidates.length; i++) {
      var el = candidates[i];
      if (!looksLikeBrand(el)) continue;
      var logo = makeLogoLink(el);
      if (logo !== el && el.parentNode) el.parentNode.replaceChild(logo, el);
      return true;
    }
    return false;
  }

  function run() {
    patchOnce();
    patchLaunchLinks();
    var tries = 0;
    var timer = setInterval(function () {
      tries += 1;
      var logoDone = patchOnce();
      var launchDone = patchLaunchLinks();
      if (tries > 6) ensureLaunchLink();
      if ((logoDone && launchDone) || tries > 20) clearInterval(timer);
    }, 250);
    try {
      var observer = new MutationObserver(function () { patchOnce(); patchLaunchLinks(); });
      observer.observe(document.documentElement, { childList: true, subtree: true });
    } catch (e) {}
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
})();

</script>
