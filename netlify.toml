[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions."queue-manager"]
  schedule = "*/5 * * * *"

[functions."loop-engine"]
  schedule = "0 */2 * * *"

[functions."researcher-background"]
  schedule = "@hourly"

[functions."workforce-heartbeat"]
  schedule = "*/30 * * * *"

[functions."avatar-reaper"]
  schedule = "*/5 * * * *"

# Hosted per-tenant avatar pages: /a/<slug> -> agent.html?slug=<slug>
[[redirects]]
  from = "/a/:slug"
  to = "/agent.html?slug=:slug"
  status = 200

# Self-serve signup
[[redirects]]
  from = "/signup"
  to = "/signup.html"
  status = 200

# ── Security: never serve source, data or tooling files ───────────────────
# publish = "." deploys the whole repo as static files. These forced 404s stop
# Netlify from serving function source (netlify/functions/*.mjs), agent memory
# JSON, node_modules, docs and config. Forced rules win over existing files.
# (Keep this list in sync with tests/netlify-toml.test.mjs.)
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/memory/*"
  to = "/404.html"
  status = 404
  force = true

