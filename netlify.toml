# CORS for /api/* is handled per-request by the functions (strict origin
# allowlist in netlify/functions/_auth.mjs) — no blanket "*" here.

# ── Security + noindex headers (AG-08) ─────────────────────────────────────
# Every response: nosniff, referrer policy, HSTS, noindex (app host — not for
# search engines).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "geolocation=(), payment=(), usb=()"

# Anti-framing on every app/marketing page. DOCUMENTED EXCEPTION: the hosted
# avatar widget (/a/<slug> → /agent.html) is intentionally NOT listed so a
# customer can embed their agent on their own site.
# {{MARK: allow customer-site iframe embedding of /a/<slug>? If no, add
#   "/agent.html" and "/a/*" to this list.}}
# (Kept as an explicit list because Netlify merges headers from all matching
# rules and has no "exclude" syntax.)
[[headers]]
  for = "/"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
[[headers]]
  for = "/index.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
[[headers]]
