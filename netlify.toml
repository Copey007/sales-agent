# CORS for /api/* is handled per-request by the functions (strict origin
# allowlist in netlify/functions/_auth.mjs) — no blanket "*" here.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), payment=(), usb=()"

[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/index.html"
  [headers.values]
    X-Frame-Options = "DENY"
