[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions."queue-manager"]
  schedule = "*/5 * * * *"

[functions."loop-engine"]
  schedule = "0 */2 * * *"

[functions."researcher-background"]
  schedule = "@hourly"

[functions."workforce-heartbeat"]
  schedule = "*/30 * * * *"

[functions."avatar-reaper"]
  schedule = "*/5 * * * *"

# Hosted per-tenant avatar pages: /a/<slug> -> agent.html?slug=<slug>
[[redirects]]
  from = "/a/:slug"
  to = "/agent.html?slug=:slug"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, apikey"
