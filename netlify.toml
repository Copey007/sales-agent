[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions."queue-manager"]
  schedule = "*/5 * * * *"

[functions."loop-engine"]
  schedule = "0 */2 * * *"

[functions."researcher-background"]
  schedule = "@hourly"

[functions."workforce-heartbeat"]
  schedule = "*/30 * * * *"

# CORS is now set per-request by netlify/functions/_auth.mjs (origin
# allowlist). The old blanket `Access-Control-Allow-Origin = "*"` for /api/*
# is removed.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Publish dir is the repo root, so source, memory dumps and docs were
# publicly downloadable (verified live: /netlify/functions/*.mjs,
# /memory/sent_emails.json, /package.json …). Hide them.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/memory/*"
  to = "/404.html"
  status = 404
  force = true

