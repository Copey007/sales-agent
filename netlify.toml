[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions."queue-manager"]
  schedule = "*/5 * * * *"

[functions."loop-engine"]
  schedule = "0 */2 * * *"

[functions."researcher-background"]
  schedule = "@hourly"

[functions."workforce-heartbeat"]
  schedule = "*/30 * * * *"

[functions."avatar-reaper"]
  schedule = "* * * * *"

# ── AskArlen rehome: legacy aisdr.a-gent.co public PAGES → aisdr.askarlen.com ──
# Only these marketing pages (plus the gated dashboards, 301'd by the aisdr-gate
# edge function) move. NEVER add /api/*, /.netlify/*, /a/*, concierge/demo
# widgets, or webhook/unsubscribe paths here: a 301 drops POST bodies and
# external callers/embeds can't be repointed instantly. Query strings pass through.
[[redirects]]
  from = "https://aisdr.a-gent.co/signup"
  to = "https://aisdr.askarlen.com/signup"
  status = 301
  force = true

[[redirects]]
  from = "https://aisdr.a-gent.co/signup.html"
  to = "https://aisdr.askarlen.com/signup.html"
  status = 301
  force = true

[[redirects]]
  from = "https://aisdr.a-gent.co/pricing"
  to = "https://aisdr.askarlen.com/pricing"
  status = 301
  force = true

[[redirects]]
  from = "https://aisdr.a-gent.co/pricing.html"
  to = "https://aisdr.askarlen.com/pricing.html"
  status = 301
  force = true

[[redirects]]
  from = "https://aisdr.a-gent.co/workers.html"
  to = "https://aisdr.askarlen.com/workers.html"
  status = 301
  force = true

[[redirects]]
  from = "https://aisdr.a-gent.co/offers-demo.html"
  to = "https://aisdr.askarlen.com/offers-demo.html"
  status = 301
  force = true

# Hosted per-tenant avatar pages: /a/<slug> -> agent.html?slug=<slug>
[[redirects]]
  from = "/a/:slug"
  to = "/agent.html?slug=:slug"
  status = 200

# Self-serve signup
[[redirects]]
  from = "/signup"
  to = "/signup.html"
  status = 200

# Workspace pricing (Starter / Growth / Custom Build)
[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

# ── Security: never serve source, data or tooling files ───────────────────
# publish = "." deploys the whole repo as static files. These forced 404s stop
# Netlify from serving function source (netlify/functions/*.mjs), agent memory
# JSON, node_modules, docs and config. Forced rules win over existing files.
# (Keep this list in sync with tests/netlify-toml.test.mjs.)
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/memory/*"
  to = "/404.html"
  status = 404
  force = true

